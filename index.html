<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Prism Hotel System</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lobster&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lobster&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <!--Span below to incorporate css addition of moon graphic in title behind the W-->
      <h1 class="header__h1"><span class="moon-letter">W<span>elcome to the Prism Hotel!</h1>
    </header>

    <main class="main">
      <section class="check-in">
        <h2 class="main__heading">Check-In Form</h2>
        <form class="check-in__form">
          <div class="check-in__field">
            <label for="guestName" class="check-in__label">Guest Name</label>

            <input
              type="text"
              id="guestName"
              class="check-in__input"
              name="guest-name"
              placeholder="Enter Your Name!"
              required
            />
          </div>

          <div class="check-in__field">
            <label for="roomNumber" class="check-in__label">Room Number</label>

            <input
              type="number"
              id="roomNumber"
              class="check-in__input"
              name="room-number"
              placeholder="Enter Room Number"
              required
            />
          </div>

          <div class="check-in__field">
            <label for="stayDuration" class="check-in__label"
              >Stay Duration (Days)</label
            >

            <input
              type="number"
              id="stayDuration"
              class="check-in__input"
              name="stay-duration"
              placeholder="Enter Number of Days"
              required
            />
          </div>

          <button type="submit" class="check-in__submit">Check In!</button>
        </form>
      </section>

      <!--Empty container to populate guest list-->
      <section class="guest-list">
        <h2>Guest List</h2>
        <div class="guest-list__container"></div>
      </section>
    </main>

    <footer class="footer">
      <p>You've always been here!</p>
    </footer>

    <script src="./script.js" async defer></script>
  </body>
</html>
